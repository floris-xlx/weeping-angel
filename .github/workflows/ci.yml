name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: check workspace
        run: cargo check --workspace --all-targets --features demo

      - name: repository health gate
        run: cargo xtask guard

      - name: clippy
        run: cargo clippy --workspace --all-targets --features demo -- -D warnings

      - name: test workspace
        run: cargo test --workspace --features demo --all-targets

      - name: demo example builds
        run: cargo build --example weeping-angel-demo --features demo
