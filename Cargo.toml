[package]
name = "weeping-angel"
version = "0.1.0"
edition = "2024"
description = "Authorized web application recon and security scanning CLI"
license = "MIT"
readme = "README.md"
keywords = ["security", "scanner", "recon", "web"]
categories = ["command-line-utilities", "development-tools"]
default-run = "weeping-angel"

[[bin]]
name = "weeping-angel"
path = "src/main.rs"

[[bin]]
name = "weeping-angel-demo"
path = "src/bin/demo.rs"
required-features = ["demo"]

[features]
default = ["demo"]
demo = ["dep:axum", "dep:tower", "dep:tower-http"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
indicatif = "0.17"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

# demo target (enabled by default)
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["fs"] }

[dev-dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
