[workspace]
resolver = "2"
members = [
    "apps/cli",
    "crates/weeping-angel-assurance-ir",
    "crates/weeping-angel-framework",
    "crates/weeping-angel-evidence",
    "crates/weeping-angel-collector",
    "crates/weeping-angel-control-test",
    "crates/weeping-angel-assurance",
    "crates/weeping-angel-canonical-catalog",
    "xtask",
]
default-members = ["apps/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/floris-xlx/weeping-angel"
authors = ["floris-xlx"]
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env", "color", "wrap_help", "unicode", "string"] }
clap_complete = "4"
futures = "0.3"
hex = "0.4"
indicatif = "0.17"
inventory = "0.3"
once_cell = "1"
quick-xml = { version = "0.41.0", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
weeping-angel-assurance = { path = "crates/weeping-angel-assurance" }
weeping-angel-assurance-ir = { path = "crates/weeping-angel-assurance-ir" }
weeping-angel-canonical-catalog = { path = "crates/weeping-angel-canonical-catalog" }
weeping-angel-collector = { path = "crates/weeping-angel-collector" }
weeping-angel-control-test = { path = "crates/weeping-angel-control-test" }
weeping-angel-evidence = { path = "crates/weeping-angel-evidence" }
weeping-angel-framework = { path = "crates/weeping-angel-framework" }

[profile.dist]
inherits = "release"
lto = "thin"
