[workspace]
resolver = "2"
members = [
    "crates/weeping-angel-assurance-ir",
    "crates/weeping-angel-framework",
    "crates/weeping-angel-evidence",
    "crates/weeping-angel-collector",
    "crates/weeping-angel-control-test",
    "crates/weeping-angel-assurance",
    "crates/weeping-angel-canonical-catalog",
    "xtask",
]

[package]
repository = "https://github.com/floris-xlx/weeping-angel"
homepage = "https://github.com/floris-xlx/weeping-angel"
name = "weeping-angel"
version = "0.2.0"
edition = "2024"
description = "Authorized web recon, code SAST, and dependency-confusion scanning CLI"
license = "MIT"
readme = "README.md"
authors = ["floris-xlx"]
keywords = [
    "security",
    "scanner",
    "recon",
    "web",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
default-run = "weeping-angel"

[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "56BAEF93-DBA2-4BB4-8502-89C386C68D67"
path-guid = "DAA53BD2-B2CE-4B13-A9A7-61C7F515C785"
license = false
eula = false

[package.metadata.packager]
before-packaging-command = "cargo build --release --bin weeping-angel"
product-name = "weeping-angel"
identifier = "dev.floris.weeping-angel"
out-dir = "target/packager"

[[package.metadata.packager.binaries]]
path = "weeping-angel"
main = true

[package.metadata.packager.deb]
section = "utils"
priority = "optional"

[[package.metadata.packager.wix.languages]]
identifier = "en-US"

[[bin]]
name = "weeping-angel"
path = "src/main.rs"

[[bin]]
name = "weeping-angel-docs-export"
path = "src/bin/weeping-angel-docs-export.rs"

[[example]]
name = "weeping-angel-demo"
path = "examples/weeping-angel-demo.rs"
required-features = ["demo"]

[features]
default = ["web"]
web = []
demo = []

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
hex = "0.4"
indicatif = "0.17"
once_cell = "1"
regex = "1"
scraper = "0.23"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
walkdir = "2"
weeping-angel-assurance = { path = "crates/weeping-angel-assurance" }
weeping-angel-canonical-catalog = { path = "crates/weeping-angel-canonical-catalog" }
weeping-angel-evidence = { path = "crates/weeping-angel-evidence" }

[dependencies.quick-xml]
version = "0.41.0"
features = ["serialize"]

[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]

[dependencies.chrono]
version = "0.4"
default-features = false
features = [
    "clock",
    "std",
    "serde",
]

[dependencies.clap]
version = "4"
features = [
    "derive",
    "env",
    "color",
    "wrap_help",
    "unicode",
    "string",
]

[dependencies.clap_complete]
version = "4"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = [
    "rustls-tls",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "json",
]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[dependencies.url]
version = "2"
features = ["serde"]

[dependencies.uuid]
version = "1"
features = ["v4"]

[dependencies.axum]
version = "0.8"
features = ["multipart"]

[dependencies.tower]
version = "0.5"

[dependencies.tower-http]
version = "0.6"
features = [
    "fs",
    "cors",
]

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tower = "0.5"
weeping-angel-assurance = { path = "crates/weeping-angel-assurance" }
weeping-angel-assurance-ir = { path = "crates/weeping-angel-assurance-ir" }
weeping-angel-collector = { path = "crates/weeping-angel-collector" }
weeping-angel-control-test = { path = "crates/weeping-angel-control-test" }
weeping-angel-evidence = { path = "crates/weeping-angel-evidence" }
weeping-angel-framework = { path = "crates/weeping-angel-framework" }

[dev-dependencies.tower-http]
version = "0.6"
features = ["fs"]

[dev-dependencies.serde]
version = "1"
features = ["derive"]

[[test]]
name = "e2e_demo"
path = "tests/e2e_demo.rs"
required-features = ["demo"]

