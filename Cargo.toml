[package]
name = "weeping-angel"
version = "0.1.1"
edition = "2024"
description = "Authorized web application recon and security scanning CLI"
license = "MIT"
readme = "README.md"
keywords = [
    "security",
    "scanner",
    "recon",
    "web",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
default-run = "weeping-angel"

[[bin]]
name = "weeping-angel"
path = "src/main.rs"

[[bin]]
name = "weeping-angel-demo"
path = "src/bin/demo.rs"
required-features = ["demo"]

[features]
default = ["demo"]
demo = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
indicatif = "0.17"
once_cell = "1"
regex = "1"
scraper = "0.23"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
walkdir = "2"

[dependencies.chrono]
version = "0.4"
default-features = false
features = [
    "clock",
    "std",
    "serde",
]

[dependencies.clap]
version = "4"
features = [
    "derive",
    "env",
]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = [
    "rustls-tls",
    "cookies",
    "gzip",
    "brotli",
    "deflate",
]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[dependencies.url]
version = "2"
features = ["serde"]

[dependencies.uuid]
version = "1"
features = ["v4"]

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.tower]
version = "0.5"
optional = true

[dependencies.tower-http]
version = "0.6"
optional = true
features = ["fs"]

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[dev-dependencies.serde]
version = "1"
features = ["derive"]
