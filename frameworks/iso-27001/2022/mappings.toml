schema = "weeping-angel/framework-pack/v1"

# ISO refs point at canonical controls. Partial never means fully satisfied.

[[mapping]]
from = "iso27001:a.8.25"
to = "source.branch-protection"
direction = "forward"
completeness = "partial"
relation = "PartiallySatisfies"
rationale = "Branch protection covers only the technical source-integrity slice of secure development."

[[mapping]]
from = "iso27001:a.8.25"
to = "source.required-review"
direction = "forward"
completeness = "partial"
relation = "PartiallySatisfies"
rationale = "Required reviews are one technical control, not the whole development life cycle."

[[mapping]]
from = "iso27001:a.8.25"
to = "source.code-ownership"
direction = "forward"
completeness = "partial"
relation = "Supports"
rationale = "Code ownership supports review quality; it does not satisfy process obligations."

[[mapping]]
from = "iso27001:a.8.26"
to = "source.security-scanning"
direction = "forward"
completeness = "partial"
relation = "Supports"
rationale = "Repository scanning supports application security requirements; it is not equivalent."

[[mapping]]
from = "iso27001:a.8.8"
to = "vulnerability.remediation"
direction = "forward"
completeness = "partial"
relation = "PartiallySatisfies"
rationale = "Scanner findings and remediation tracking cover only the technical vulnerability slice."

[[mapping]]
from = "iso27001:a.8.8"
to = "source.security-scanning"
direction = "forward"
completeness = "partial"
relation = "Supports"
rationale = "Enabled scanning is an input to vulnerability management, not the full practice."

[[mapping]]
