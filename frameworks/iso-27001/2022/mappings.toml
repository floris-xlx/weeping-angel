completeness = "partial"
relation = "PartiallySatisfies"
rationale = "Privileged MFA is one authentication factor requirement, not the full control."

[[mapping]]
from = "iso27001:a.8.2"
to = "access.mfa.privileged"
direction = "forward"
completeness = "partial"
relation = "Supports"
rationale = "MFA on privileged accounts supports privileged-access management."

[[mapping]]
