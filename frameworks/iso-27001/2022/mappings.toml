schema = "weeping-angel/framework-pack/v1"

# ISO 27001:2022 structural refs → landed canonical catalog controls.
# Partial / Supports / Related / EvidenceFor / SubsetOf never fully satisfy.

[[mapping]]
from = "iso27001:a.8.5"
to = "control.identity.privileged-mfa"
direction = "forward"
completeness = "partial"
relation = "PartiallySatisfies"
rationale = "Privileged MFA is the assessable technical slice of authentication for privileged identities, not the whole authentication practice."
provenance = { source = "BuiltIn", reference = "catalog/canonical/v1 identity", author = "weeping-angel" }
valid_for = { from = "2022", to = "2022" }

