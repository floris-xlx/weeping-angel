schema = "weeping-angel/canonical-catalog/v1"

# Shared attestation shape (facts, not conclusions). Store via with_value.
# subject_id, attested_by, attested_at, kind, artifact_ref, review_state, valid_until, current
# kind in {attestation, document-reference, approval, meeting-record,
# auditor-observation, training-record, exercise-record, risk-acceptance,
# policy-acknowledgement}
# review_state in {draft, submitted, reviewed, accepted, rejected}

[[evidence]]
id = "evidence.manual.attestation"
title = "Manual attestation fact"
evidence_type = "manual.attestation"
collection = "manual"
criticality = "required"

