schema = "weeping-angel/canonical-catalog/v1"

[catalog]
id = "canonical"
version = "1"

[files]
controls = ["controls/fixture.example.toml", "controls/identity.toml", "controls/sdlc.toml", "controls/vulnerability.toml"]
evidence = ["evidence/fixture.example.toml", "evidence/identity.toml", "evidence/sdlc.toml", "evidence/vulnerability.toml"]
tests = ["tests/fixture.example.toml", "tests/identity.toml", "tests/sdlc.toml", "tests/vulnerability.toml"]

[digest]
algorithm = "sha256"
canonicalization = "canon/v1"
