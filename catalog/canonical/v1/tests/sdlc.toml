schema = "weeping-angel/canonical-catalog/v1"

[[test]]
id = "test.source.repository-inventory-complete"
control = "control.source.repository-inventory"
kind = "automated"
required_evidence = ["evidence.repository.inventory"]
break_on = []

[test.expression]
op = "all-subjects"
evidence = "evidence.repository.inventory"
field = "in_scope"

[[test.subjects]]
kind = "repository"

