id = "test.source.visibility-governed"
control = "control.source.visibility-governance"
kind = "automated"
required_evidence = ["evidence.repository.visibility"]
break_on = []

[test.expression]
op = "coverage-at-least"
percentage = "100"
evidence = "evidence.repository.visibility"
field = "visibility_allowed"

[[test.subjects]]
kind = "repository"

