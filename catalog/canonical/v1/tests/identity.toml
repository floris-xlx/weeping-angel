schema = "weeping-angel/canonical-catalog/v1"

[[test]]
id = "test.identity.unique-user-identities"
control = "control.identity.unique-user-identities"
kind = "automated"
required_evidence = ["evidence.identity.inventory"]
break_on = []

[test.expression]
op = "all-subjects"
evidence = "evidence.identity.inventory"
field = "unique_key"

[[test.subjects]]
kind = "user"

[[test]]
id = "test.identity.mfa-enabled"
control = "control.identity.mfa"
kind = "automated"
required_evidence = ["evidence.identity.inventory", "evidence.identity.mfa-status"]
break_on = []

[test.expression]
op = "coverage-at-least"
percentage = "100"
evidence = "evidence.identity.mfa-status"
field = "mfa_enabled"

[[test.subjects]]
kind = "user"

[[test]]
id = "test.identity.privileged-mfa-enabled"
control = "control.identity.privileged-mfa"
kind = "automated"
