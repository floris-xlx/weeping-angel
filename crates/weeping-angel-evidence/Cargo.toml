[package]
name = "weeping-angel-evidence"
version = "0.2.0"
edition = "2024"
description = "Immutable evidence envelopes and observations for Weeping Angel assurance"
license = "MIT"
publish = false

[features]
default = []
demo = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
weeping-angel-assurance-ir = { path = "../weeping-angel-assurance-ir" }
