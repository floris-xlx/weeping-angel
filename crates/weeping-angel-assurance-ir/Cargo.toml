[package]
name = "weeping-angel-assurance-ir"
version = "0.2.0"
edition = "2024"
description = "Framework-neutral compliance IR for the Weeping Angel assurance runtime"
license = "MIT"
publish = false

[features]
default = []
demo = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
