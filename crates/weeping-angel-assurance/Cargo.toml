[package]
name = "weeping-angel-assurance"
version = "0.2.0"
edition = "2024"
description = "Public assurance facade: collectors + compile + control-tests"
license = "MIT"
publish = false

[features]
default = []
demo = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
weeping-angel = { path = "../..", default-features = false }
weeping-angel-assurance-ir = { path = "../weeping-angel-assurance-ir" }
weeping-angel-collector = { path = "../weeping-angel-collector" }
weeping-angel-control-test = { path = "../weeping-angel-control-test" }
weeping-angel-evidence = { path = "../weeping-angel-evidence" }
weeping-angel-framework = { path = "../weeping-angel-framework" }
