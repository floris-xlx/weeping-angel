schema = "weeping-angel/architecture/v1"

# Canonical crate-level concept ownership (kind + paths).
# Concept-level five-role SSOT is architecture/domain-ownership.toml (ADR 0050).
# Package names are live workspace members only.
# Do not invent weeping-angel-catalog or weeping-angel-assurance-cli.

[policy]
ownership_kinds = ["exclusive", "facade", "projection", "adapter", "shared-primitive"]
required_concepts = [
  "catalog",
  "framework_compilation",
  "readiness_projection",
  "temporal_evidence_selection",
  "assessment_lineage",
  "evidence_persistence",
  "assurance_cli",
]

[ownership.catalog]
crate = "weeping-angel-canonical-catalog"
kind = "exclusive"
paths = ["crates/weeping-angel-canonical-catalog"]

[ownership.framework_compilation]
crate = "weeping-angel-framework"
kind = "exclusive"
paths = ["crates/weeping-angel-framework"]

[ownership.readiness_projection]
crate = "weeping-angel-assurance"
kind = "projection"
paths = ["crates/weeping-angel-assurance/src/readiness.rs"]

# Crate-level row: kind=exclusive names the assurance timeline/diff façade
# (ACP-T07). It is not whole-concept exclusivity of the leaf algorithm.
# Physical seats (DUP-017): select_latest_as_of stays in control-test;
# project_timeline stays in assurance. Concept split=divided is
# architecture/domain-ownership.toml (ADR 0050). Do not move the primitive.
[ownership.temporal_evidence_selection]
# Façade vs leaf: project_timeline in assurance; select_latest_as_of in control-test.
crate = "weeping-angel-assurance"
kind = "exclusive"
paths = [
  "crates/weeping-angel-assurance/src/temporal.rs",
  "crates/weeping-angel-control-test/src/temporal.rs",
]

[ownership.assessment_lineage]
crate = "weeping-angel-assurance"
kind = "exclusive"
paths = ["crates/weeping-angel-assurance/src/lineage.rs"]

[ownership.evidence_persistence]
crate = "weeping-angel-evidence"
kind = "exclusive"
paths = ["crates/weeping-angel-evidence"]

[ownership.assurance_cli]
crate = "weeping-angel"
kind = "facade"
paths = ["src/main.rs", "src/cli.rs"]

[ownership.repository_guard]
crate = "xtask"
kind = "exclusive"
paths = ["xtask"]

# Architectural Consolidation Program Phase 0: freeze feature expansion.
# Extra tables are not ignored; load_architecture_manifest fail-closes if this
# table is missing or malformed. Enforcement: Guard 01 + Guard 04 invariants.
[program.architectural_consolidation]
status = "active"
feature_expansion = "restricted"
allowed_change_classes = [
  "bug-fix",
  "security-fix",
  "consolidation",
  "non-semantic-collector",
  "consolidation-docs",
]
forbidden_change_classes = [
  "new-public-domain-type",
  "new-persistence-representation",
  "new-projection-path",
  "new-root-test-binary",
  "new-duplicated-helper",
  "new-compatibility-alias",
  "second-ssot",
]
