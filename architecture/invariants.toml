schema = "weeping-angel/architecture-invariants/v1"

# Guard 04 evaluates every [[invariant]] against RepositoryModel.

[[invariant]]
id = "INV-OWNERSHIP-LIVE-CRATES"
summary = "Ownership table names live workspace packages and existing paths only"
guard_check = "02"

[[invariant]]
id = "INV-NO-HYPOTHETICAL-PACKAGES"
summary = "Packages weeping-angel-catalog and weeping-angel-assurance-cli must not exist"
guard_check = "02"

[[invariant]]
id = "INV-DEBT-RESOLVED-HAS-PROOF"
summary = "status=resolved requires regression_tests or repository_guard"
guard_check = "13"

[[invariant]]
id = "INV-INVARIANTS-EVALUATED"
summary = "Every [[invariant]] is evaluated against RepositoryModel; skip is illegal without a live debt id"
guard_check = "04"

[[invariant]]
id = "INV-ADR-NAMESPACE-UNIQUE"
summary = "Every ADR markdown file has a unique NNNN prefix"
guard_check = "14"

[[invariant]]
id = "INV-NO-SUPERSEDED-BASELINES"
summary = "Superseded *.baseline.rs suites are deleted, not ignored"
guard_check = "13"

[[invariant]]
id = "INV-CONSOLIDATION-MODE-ACTIVE"
summary = "architecture.toml [program.architectural_consolidation] is active with restricted feature expansion"
guard_check = "04"

[[invariant]]
id = "INV-CONSOLIDATION-BASELINE-PRESENT"
summary = "Frozen docs/debt/consolidation-baseline.json and .md exist with weeping-angel/consolidation-baseline/v1"
guard_check = "04"

[[invariant]]
id = "INV-CONSOLIDATION-EXPANSION-RESTRICTED"
summary = "Live expansion metrics must not increase versus the frozen consolidation baseline"
guard_check = "04"

[[invariant]]
id = "INV-STRUCTURAL-DUPLICATION-BACKLOG"
summary = "docs/debt/structural-duplication.toml is the v2 program backlog with close law"
guard_check = "04"
