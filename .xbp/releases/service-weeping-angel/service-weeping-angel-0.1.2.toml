announcement_github_body = """
## Install weeping-angel 0.1.2

### Install prebuilt binaries via shell script

```sh
curl --proto '=https' --tlsv1.2 -LsSf https://github.com/floris-xlx/weeping-angel/releases/download/weeping-angel-0.1.2/weeping-angel-installer.sh | sh
```

### Install prebuilt binaries via powershell script

```sh
powershell -ExecutionPolicy Bypass -c "irm https://github.com/floris-xlx/weeping-angel/releases/download/weeping-angel-0.1.2/weeping-angel-installer.ps1 | iex"
```

### Install prebuilt binaries via Homebrew

```sh
brew install weeping-angel
```

