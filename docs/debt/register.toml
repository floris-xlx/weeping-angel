[[finding]]
id = "DEBT-DUP-ADR"
title = "Duplicate ADR ID prefixes"
status = "confirmed"
summary = "docs/adr reuses historical prefixes 0003 (25), 0005 (5), 0007 (2), and 0008 (4), plus three concurrent increment-2 drafts under 0011. Guard 14 contains the pinned file set via architecture/adr-identity.toml; do not silently renumber. A new file reusing those prefixes fails."
